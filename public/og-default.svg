<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1a2c"/>
      <stop offset="1" stop-color="#070d18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#c49e5a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c49e5a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Brass W monogram, top-left -->
  <g transform="translate(72,80)">
    <rect width="72" height="72" rx="6" fill="#b07a4d"/>
    <text x="36" y="50" text-anchor="middle"
          font-family="Georgia, 'Bodoni Moda', serif"
          font-weight="700" font-size="40" fill="#f3ead7"
          letter-spacing="2">W</text>
  </g>

  <!-- Eyebrow label -->
  <text x="72" y="232" font-family="ui-monospace, 'JetBrains Mono', monospace"
        font-weight="600" font-size="18" letter-spacing="6" fill="#c49e5a">
    A FAMILY BUSINESS · SINCE 1954
  </text>

  <!-- Main title -->
  <text x="72" y="320" font-family="Georgia, 'Fraunces', 'Bodoni Moda', serif"
        font-weight="700" font-size="78" fill="#f3ead7"
        letter-spacing="-1.5">
    Webbers Amusements
  </text>

  <!-- Italic subtitle -->
  <text x="72" y="384" font-family="Georgia, 'Fraunces', serif"
        font-weight="500" font-style="italic" font-size="40"
        fill="#c49e5a">
    Premium adult gaming. British heritage.
  </text>

  <!-- Footer strip -->
  <text x="72" y="552" font-family="ui-monospace, 'JetBrains Mono', monospace"
        font-weight="500" font-size="16" letter-spacing="4" fill="#9a8e76">
    FIVE VENUES · CHESTER · NORTH WALES · GREATER MANCHESTER · 18+
  </text>

  <!-- Right-side hairline strip -->
  <rect x="1100" y="0" width="2" height="630" fill="#c49e5a" fill-opacity="0.32"/>
</svg>
